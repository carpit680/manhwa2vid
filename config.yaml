# Default pipeline configuration

ingest:
  page_width: 1080
  dpi_scale: 2.0

panels:
  min_panel_height: 120
  whitespace_threshold: 0.92
  fallback_chunk_height: 800
  fallback_overlap: 80
  split_image_files: hybrid  # one_to_one | always_split | hybrid
  regions:
    enabled: true
    tol: 18                 # brightness distance from page background = content
    close_px: 5             # morphological close; 9+ re-bridges staggered insets
    min_area_frac: 0.004    # component smaller than this fraction of the band is noise
    bubble_bright_frac: 0.45  # region mostly >232 brightness = bare bubble, absorbed
    sliver_max_aspect: 0.20   # band flatter than 5:1 is a split fragment or a system
                              # banner — either way it belongs WITH its neighbour, not
                              # alone (min_panel_height is absolute and misses these)
    max_regions: 6
    pad_frac: 0.03
  filter_non_story: true
  filter_by_filename: true
  exclude_panel_ids: ["p0010_02"]  # ch1: diagonal page-transition sliver just above the blank threshold
  # Blank page-transition slivers: exclude panels with almost no pixel content before they
  # reach OCR/vision or the render. Thresholds measured on ch1 — the three blank slivers
  # scored ink<=0.25/dark<=0.06; the sparsest real panel scored ink 0.32/dark 0.25.
  exclude_blank_panels: true
  blank_max_ink_ratio: 0.30
  blank_max_dark_ratio: 0.10

ocr:
  enabled: true   # PaddleOCR (CPU) — ground truth for dialogue; VLM claims must overlap it
  confidence_threshold: 0.5

llm:
  provider: groq  # groq | gemini | mistral | openai | ollama | mock
  # Sampling temperature, per stage below, defaulting here. 0 = greedy. Before this
  # existed nothing was ever sent, so every call ran at the provider default (~1.0) and
  # each run resampled the scene cards, the synopsis and the outline as well as the
  # prose — two runs of one chapter were never comparable. Hosted providers batch and
  # route server-side, so 0 buys much LESS variance, never byte-identical runs.
  temperature: 0.0
  groq:
    # Free tier caps TOKENS per day (200k) — images exhaust it in ~60 panels.
    text_model: openai/gpt-oss-120b
    vision_model: qwen/qwen3.6-27b  # llama-4-scout no longer on this key
  gemini:
    # Paid tier (added 2026-08-17) — no more free-tier RPD walls. gemini-2.5-flash and
    # gemini-2.5-pro both now 404 "no longer available to new users" on this key, ahead
    # of the announced Oct 16 retirement — do not pin back to any 2.5 model.
    text_model: gemini-3.5-flash
    vision_model: gemini-3-flash-preview  # bakeoff 2026-08-17: only 3.x candidate with
    # 3/3 speaker-grounded on the back-turned-MC trap panel; 3.5-flash lost that one
  mistral:
    # Free tier: large monthly token allowance, low requests-per-minute ceiling.
    text_model: mistral-large-latest
    vision_model: mistral-medium-latest  # pixtral retired; medium 3+ is multimodal

scene:
  # Paid tier (2026-08-17): gemini-2.5-flash is dead on this key (404 "no longer
  # available to new users"). gemini-3-flash-preview bakeoff'd clean on all 3 ground-truth
  # trap panels (0 hallucinated/missed MC, 3/3 speaker-grounded) — see tools/vision_bakeoff.py.
  # Mistral (medium) remains the fallback: SCENE_LLM_PROVIDER=mistral to switch back.
  provider: gemini
  model: gemini-3-flash-preview
  # PERCEPTION MODE — chapter | per_panel
  # chapter: ONE multimodal request carrying the whole chapter, so the model tracks
  # identity and causality across panels the way a human reader does. per_panel makes
  # ~60 isolated calls: story structure and 'this is the same man from panel 8' are
  # destroyed at perception time and no downstream gate can recover them. per_panel was
  # forced by Groq's 8k/request cap; on paid Gemini a 62-panel chapter is ~16k image
  # tokens, so one call is both better and cheaper than 60 that re-send the cast list.
  mode: chapter
  # Pass 1 reads ALL panels (story + who recurs). Pass 2 annotates in small windows
  # whose images carry their panel id inline — one 59-image annotate pass returned
  # correct descriptions bound to the id 3 positions later, because a model cannot
  # reliably count images. Chapter understanding rides into each window as text.
  chapter_window_panels: 12
  chapter_max_output_tokens: 16384
  batch_size: 1                 # per_panel mode only
  # Lead each vision request with cached reference images of the main cast so identity
  # is matched against pixels, not text descriptions two similar men both satisfy.
  # DEFAULT OFF — measured harmful on ch2 2026-08-17: references are whole story panels,
  # and the model transcribed the REFERENCE's speech bubbles instead of the panel's
  # (85% of ch2 cards inherited the ch1 cold-open's injury imagery and narration, vs 7%
  # without). Re-enable only with the shape/text guards in characters/reference.py and
  # re-measure action-text diversity against a no-reference baseline.
  use_reference_images: false
  # Only identifications the vision model itself rates this confident may become
  # reference images. A shaky anchor propagates one wrong face through the series.
  reference_min_confidence: 0.75
  vision_max_side: 512  # image tokens scale with area; 512px ≈ 0.44x the spend of 768px

characters:
  # Wiki scraping seeds junk profiles (Template:Infobox..., User:...) into the bible;
  # the glossary carries the sticky cast and scout/quest fill the rest.
  mc_labels: ["MC", "the protagonist", "our guy"]
  ban_words: ["character", "unnamed character", "a person", "the character", "two characters"]

# --- story-first script generation --------------------------------------------------
# read (what the pages literally show) -> write (one creative pass over the pages) ->
# audit (grounding check) -> revise once -> align (paragraph -> panels) -> match
# (sentence -> the panels that depict it). The panel-locked architecture this replaced
# was measured against it and lost on content fidelity at both model tiers; it is gone
# (docs/history/ keeps the comparison).

read:
  # Perception for ACCOUNTABILITY only — the writer never sees this file. Extracts
  # verbatim system messages, plot-carrying dialogue, time markers, cast.
  provider: gemini
  model: gemini-3-flash-preview
  # Width cap for whole-PAGE calls (read / write / audit / align). NOT
  # scene.vision_max_side (512), which is tuned for panel crops and destroys pages: a
  # webtoon strip is ~800x10000, so a longest-side cap renders it as a 40px-wide sliver
  # and every caption and system message becomes unreadable. Measured: the printed
  # "76 HOURS EARLIER" marker was invisible to every page stage until this was fixed.
  page_max_width: 1024

audit:
  # Grounding check + the single permitted revision. Needs to catch subtle drift
  # (a one-word "cleared the second floor" contradiction survived the pro writer),
  # so this is the pro tier, not flash.
  provider: gemini
  model: gemini-3.1-pro-preview

align:
  # Retrieval, not generation: "which pages is this paragraph about". A cheap model is
  # correct here, and nothing it returns can alter a word of the narration.
  provider: gemini
  model: gemini-3-flash-preview
  # Report-only floor. Narration decides coverage; a very low number usually means the
  # alignment map collapsed rather than that the writing was selective.
  min_panel_fraction: 0.4
  # --- shot matching: which panel DEPICTS each sentence ---------------------------
  # Without this, panels are handed to paragraphs by airtime alone and the picture
  # desynchronises from narration that compresses. Measured on the arithmetic-only
  # videos: 86% (Frozen Player) and 93% (Solo Leveling) of matchable sentences were
  # showing a panel that does not depict them.
  match_enabled: true
  # Pro tier, decided on measurement: flash matched 74% of Frozen Player's sentences
  # but only 52% of Solo Leveling's, and an unmatched sentence HOLDS — so a low
  # match rate directly becomes slow pacing (SL 1.3 sentences/shot, 12.8 cuts/min
  # against Mamoru's 16.3, median shot 5.0s against his 2.87s). The 2x2 experiment
  # already showed pro is markedly better at grounded page reading.
  # flash, measured: pro did not raise match rate (FP 74->76%, SL 52->49%) — the
  # bottleneck was collage pages, fixed at the split stage, not model tier.
  match_model: gemini-3-flash-preview
  # Panels per matching call. The scene pass windows at 12 for the same reason: id
  # binding drifts with many interleaved images (measured +3 shift at 59).
  match_window_panels: 16
  # Shots shorter than this merge into the previous one. Measured from Mamoru's own
  # video (reference/mamoru_shot_profile.md): median shot 2.87s, and 22% of his shots
  # run under 1.5s — so a 1.5s floor was clipping a fifth of his range.
  min_shot_seconds: 1.0
  # Ceiling on the content-free filter: on synthetic fixtures it flagged EVERY panel
  # and align fell over. Real titles measure 11% (FP) / 5% (SL), so exceeding this
  # means the detector does not understand the art style — run unfiltered instead.
  max_content_free_fraction: 0.5
  accent_shot_seconds: 0.4  # intra-sentence multi-panel cuts survive down to this;
                            # the reference channel runs 22% of its cuts under 1.5s
  # Paragraph split ceiling for alignment beats. NOT script.max_beat_words (60, an old
  # lint-path knob): align.py has always read THIS key and silently used its default of
  # 90 because the key was absent — the config-defaults trap, recorded here so the value
  # the code runs with is the value the file shows.
  max_beat_words: 90

script:
  # The writer. Pro tier: arm B vs arm C showed identical CONTENT at both tiers and
  # reference-quality prose only at pro.
  freeform_model: gemini-3.1-pro-preview
  # One call per this many pages; windows carry the FULL text so far, never a digest.
  freeform_max_pages_per_call: 60
  audit_enabled: true
  # Text tier upgraded alongside vision 2026-08-16 (Groq unusable: 8k/request cap;
  # mistral-large misattributed enough to trip the grounded fallback on 12/18 beats).
  # Paid tier (2026-08-17) removed the 20 req/day free-tier wall that forced the
  # gemini-2.5-flash fallback (also now dead on this key — see llm.gemini above).
  provider: gemini
  model: gemini-3.5-flash
  outro_cta: true
  target_wpm: 196       # MEASURED on the full 16-beat FP script at kokoro_speed 1.30
                        # with kokoro_trim_ms 150 — not benched. Two benches this week
                        # missed the delivered rate in OPPOSITE directions (+18, then
                        # -17 wpm), because synthesis is per-sentence and the trim's
                        # saving scales with sentence COUNT, not word count. align.py
                        # budgets panels from this number, so it must be the delivered
                        # one; narration-pace is what catches it when it is not.
                        # Field context: competitor median is 218 wpm
                        # (reports/field_measurement_2026-08-29.md).
  max_narrator_asides: 4  # the 0.24 first-person per 1k measurement means the narrator
                          # never says "I" — NOT that he has no voice. He runs 8.2
                          # evaluative asides and 2.0 similes per 1k.
  # (casual_mc_epithet removed: it was read nowhere in src/, and genz_level already tunes
  # the same thing. The register itself is now asked for in recap.txt and MEASURED by
  # scorecard's casual_epithets_per_1k floor, which is what a knob should have been.)
  max_beat_words: 60
  # Chapter word budget: narration is audio-locked, so word count IS runtime.
  # Measured references: Mamoru ~490/chapter, golds 525 and 677.
  words_per_chapter: 550
  mc_anchor_every_beats: 2
  transition_line: ""
  # Attach each chunk's actual panels to the narration call. The writer used to compose
  # from text cards while the alignment audit judged it against images — an image-blind
  # author checked by a sighted critic. Requires a multimodal script model.
  words_per_panel_target: 14 # per-beat word ceiling = panels x this; enforced by lint rewrite
  # Narration runs HOT while the structured stages stay greedy. Lowering it made the
  # prose flat, and its variance stops being noise once something is choosing between
  # samples: one Frozen Player draft dropped the ice-break entirely and the next named it.
  # Reliability comes from selection and revision, not determinism.
  narration_temperature: 0.9
  max_required_lines_per_beat: 4  # 4 x 10 words = 40, leaving ~20 of the 60-word ceiling
                                  # for spine and stakes. Asking for all 6 a beat may
                                  # carry fills the budget and produces list-recitation.
  words_per_required_line: 10     # words_per_beat(40) / measured median quoted lines(4);
                                  # within 1% of words_per_shown_panel — same speech rate
  # warn = report only | system = FAIL on a dropped bracketed system message | strict =
  # FAIL on any dropped printed line. `system` because that tier is different in KIND:
  # a handful per chapter, always plot-critical, and the exact class that went missing.
  # The general check stays a warn — its 0.3 stemmed-overlap proxy moves for honest
  # reasons (a faithful paraphrase scores low), so blocking on it would tune the metric.

qa:
  # +-15% of a 220 target is +-33 WPM, wide enough that a run delivering 250 passed
  # cleanly. 8% still absorbs ordinary synthesis variance but catches a real miss.
  pace_tolerance: 0.08

tts:
  provider: kokoro      # kokoro | chatterbox | openai | mock
  # Kokoro (Apache-2.0, 82M, preset voices — cannot clone a reference voice):
  # Weighted style-tensor blend, chosen by ear 2026-08-29 against every preset and
  # several mixes: af_nicole's vector steadies and slows the read, af_heart keeps the
  # warmth. Kokoro's own "a,b" syntax averages equally; this takes weights. A bare
  # preset name still works — see tts/kokoro.py:_resolve_voice.
  kokoro_voice: "af_heart:0.65,af_nicole:0.35"
  # Trim Kokoro's OWN lead/trail silence to this many ms per sentence. Measured: it
  # emits ~250 ms lead + ~500 ms trail per sentence — 4.6 s of dead air across a
  # six-sentence passage, against the 60 ms join gap we add. Synthesis is one call per
  # sentence (so every sidecar timing is measured, not estimated), which puts that
  # silence at every boundary. Trimming raises words-per-minute with NO change to
  # articulation, and 1.30+trim was preferred by ear over 1.35 untrimmed at the same
  # delivered pace. Applied before the sidecar is written, because the shot planner
  # joins the shot list to those durations. 0 disables.
  kokoro_trim_ms: 150
  # 1.35 because Kokoro at 1.0 delivers ~171 WPM, while script.target_wpm (235) is what
  # curate.words_per_shown_panel budgets panels from — so the pipeline planned 9.79 words
  # into 2.5s that actually took 3.4s to say, and every panel dwelled ~36% too long. The
  # reference channel runs 232 WPM measured over the same two chapters (964 words /
  # 248.9s); 171 x 1.35 lands there, which makes target_wpm TRUE rather than aspirational.
  # Raised the voice to meet the constant rather than lowering the constant to meet the
  # voice: the latter would have grown the panel budget ~37% and merged more beats,
  # making the slideshow feel worse. The narration-pace gate now measures the delivered
  # rate so this can never silently drift again.
  # 1.19, not the 1.05 a bench of concatenated text suggested: the real pipeline
  # synthesises each BEAT to its own wav with padding between, so a single-blob
  # calibration overstates the rate. Measured on the full 13-beat SL script:
  # 1.05 -> 184 WPM, 1.14 -> 194, 1.19 -> 202. Calibrate the way the pipeline RUNS,
  # not the way it is convenient to bench — the narration-pace gate is what caught
  # the 16-WPM gap between the two.
  kokoro_speed: 1.30  # chosen by ear 2026-08-29 from a 1.00-1.65 sweep in the blended
                      # voice, paired with kokoro_trim_ms 150. 1.35 untrimmed and
                      # 1.30+trim deliver the same pace; the trimmed one reads calmer,
                      # because what sounded "rushed" was dead air, not articulation.
                      # Delivered rate on the real script: 196 WPM (see target_wpm).
                        # from the target, so a target the voice does not actually
                        # deliver makes every dwell wrong. Measured: 1.19 delivered
                        # 191 WPM, so 220 needs ~1.37. The narration-pace gate
                        # re-measures after synthesis and warns if this drifted.
  kokoro_lang: a        # 'a' = American English
  # Chatterbox-only settings below:
  device: cuda          # cuda | cpu | mps — auto-detects if omitted
  model: standard       # standard | turbo | multilingual
  voice_prompt:         # optional ~5-10s WAV for voice cloning (deeper voice works well)
  exaggeration: 0.5     # calm delivery; pair with voice_prompt for tone
  cfg_weight: 0.6       # slightly steadier, more grounded voice
  # pace/pitch of 1.0 = NO ffmpeg post-processing at all (apply_tts_postprocess early-returns).
  # Any other value runs a resample-based pitch shift and/or atempo time-stretch, which is the
  # main source of the "artificial" sound. Leave both at 1.0 unless you accept that trade.
  pace_multiplier: 1.0
  pitch_shift: 1.0
  language_id: en       # for multilingual model only
  # OpenAI-only settings:
  openai_model: tts-1
  voice: onyx
  speed: 0.85


video:
  width: 1920
  height: 1080
  fps: 30
  # Real-ESRGAN anime 2x on shown panels (cached in <project>/panels_2x/). Source art
  # is 720-800px wide; fill-frame magnifies 2.4-2.7x at 1080p and Lanczos alone is soft.
  upscale:
    enabled: true
    scale: 2
  render_qa: true  # measure the rendered file (opening shot, bubbles, dead space,
                   # clipped text, true peak, shot rhythm) and gate on it
  min_panel_seconds: 1.0  # matches align.min_shot_seconds — Mamoru's measured p10 is
                          # 0.95s and 22% of his shots run under 1.5s, so a 1.5 floor
                          # flattened our distribution (median 4.78s vs his 2.87s)
  max_panel_seconds: 5.0   # was 10.0 — long dwells read as slideshow next to the reference
  # Panels are dropped (not flashed) when a beat's narration cannot show them this long.
  # Lower than min_panel_seconds on purpose: mild compression is fine, 0.4s strobing is not.
  panel_drop_floor_seconds: 1.0
  # Pace budget for importance-first curation: the timeline shows ~audio/target panels
  # per beat, chosen by writer-marked key panels + salience. The reference channel runs
  # ~2s per shown panel; 2.5 keeps a touch more air.
  target_panel_seconds: 2.5
  # Timeline QA warns when a single panel dwells longer than this multiple of
  # max_panel_seconds — the signature of a beat whose narration outruns its panel count.
  dwell_warn_multiplier: 1.5
  # Music bed level going INTO the sidechain, in dB. Tuned by measurement against the
  # STEM-DERIVED duck depth: -30 measures 13.57 dB on Frozen Player's full 6:22, in the
  # 12-15 band. Replaces the old linear `bgm_volume: 0.18` — two controls fighting over
  # one level is how the bed ended up inaudible.
  #
  # An earlier pass set this to -6.0 by tuning against the MIX-ONLY duck estimate, which
  # overstates the duck by 2-7 dB on long material. That would have shipped a bed sitting
  # 3 dB under the narration while a gate reported 13. Tune this against
  # measure.audio.duck_depth_from_stem, never the estimate.
  # -36, not -30: chosen by ear on a 5s A/B (2026-08-29). The old value was tuned to
  # land inside the audio-duck-depth 12-15 dB band, which came from the audio spec and
  # not from any measurement of the reference — so it was a number serving a number.
  bgm_gain_db: -36.0
  # Voice depth, in semitones, formants preserved (rubberband). Set 0 to disable.
  # Beyond -2 the artefacts accumulate over a long passage.
  # 0.0, not -1.5: the rubberband shift was A/B'd against a flat chain and rejected by
  # ear — formant-preserved pitch shifting on an already-synthetic voice adds a warble
  # that reads as "weird" rather than "deeper". One number to put it back.
  voice_pitch_semitones: 0.0
  # 0.0 disables the aecho stage entirely. The spec added 7% wet to make a dry TTS voice
  # read as "recorded in a place"; A/B'd the same day, dry won.
  voice_echo_wet: 0.0
  # Loudness range target. The old value was 11, which let the delivery sit at 2.0-2.3 LU
  # — a flat wall with no dynamics at all.
  loudness_range: 7
  motion_supersample: 2
  max_scroll_px_per_sec: 600
  # Fill-frame camera (2026-08-26 decision): the camera is a 16:9 window INSIDE the
  # panel, panned in reading order — whole-panel letterboxing wasted 51-52% of the
  # screen as blur bars across both audited videos.
  letterbox_min_width_fraction: 0.32  # below this the panel is too thin to read whole
  letterbox_push_in: 0.04             # gentle breathing; "whole" must stay true
  letterbox_blur_radius: 20
  # The camera DRIFTS, it does not traverse. Measured on the reference channel's own
  # edit: 0% of its shots move more than 0.25 frame-heights, median 0.093, p90 0.201.
  # Ours panned on 93% of shots (47% over 0.25) and read as one continuous scroll.
  max_pan_frame_fraction: 0.20  # cap on per-shot travel, as a fraction of the window
  pan_min_seconds: 1.8          # shorter shots hold still — fast AND moving is jarring
  # Longest one image may hold before the planner splits it across two panels. The
  # reference channel's own longest shot is 16.37s; 10 leaves room under that. Only
  # splits when a spare unused panel exists and the shot spans >=2 sentences, so the
  # cut lands on a sentence boundary.
  max_shot_seconds: 10.0
  # Shots ending inside this window are framed for ARTWORK rather than contrast. Gradient
  # energy cannot tell a face from a wall of lettering — the spiky edges of a speech
  # bubble are exactly what it rewards — and Solo Leveling opened on "E-RANK HUNTER." on
  # black at t=6s because of it. Matches the opening-shot gate's window.
  opening_art_seconds: 15.0
  max_dwell_seconds: 7.0    # longer shots get a mid re-frame cut on the same panel
  bubble_salience_weight: 0.40  # how hard lettering repels the camera; 0.15 shoved it off the subject

export:
  preview_scale: 0.5
  loudness_target: -14
