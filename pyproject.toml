[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manhwa2vid"
version = "0.1.0"
description = "End-to-end manhwa recap video pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "numpy>=1.26",
    "pyyaml>=6",
    "pydantic>=2",
    "httpx>=0.27",
    "openai>=1.0",
    "python-dotenv>=1.0",
    # Reading the finished mix for the audio QA gates (bed level, duck depth, tonality).
    # Was tts-extra-only, but QA runs on every render regardless of TTS provider.
    "soundfile>=0.12",
    # Last-resort repair for malformed model JSON (literal newlines in strings, trailing
    # commas, single-quoted keys, unescaped quotes in prose). See _extract_json_object.
    "json-repair>=0.30",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
translate = ["transformers>=4.40", "sentencepiece>=0.2", "torch"]
tts-chatterbox = ["chatterbox-tts", "soundfile"]
tts-kokoro = ["kokoro>=0.9", "soundfile"]
upscale = ["spandrel>=0.4", "torch"]
# After install, for RTX 5070/5090 (Blackwell sm_120) use PyTorch cu128 nightly:
#   pip install --pre torch torchaudio --index-url https://download.pytorch.org/whl/nightly/cu128
dev = ["pytest>=8"]
# Reference-video tooling: download captions/clips from recap channels to profile their style
reference = ["yt-dlp"]
# Deterministic grammar net for the script polish (needs a Java runtime; LT server
# downloads once on first use, then fully offline)
grammar = ["language_tool_python>=2.8"]

[project.scripts]
manhwa2vid = "manhwa2vid.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
